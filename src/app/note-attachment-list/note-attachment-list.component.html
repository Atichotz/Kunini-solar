@if (groups().images.length > 0) {
<div class="att-images">
    @for (image of groups().images; track image.id) {
    <a class="att-image" [attr.href]="image.url || null" target="_blank" rel="noopener noreferrer"
        [title]="image.name">
        <img [src]="image.url" [alt]="image.name" loading="lazy" />
    </a>
    }
</div>
}
@if (groups().files.length > 0) {
<div class="att-files">
    @for (file of groups().files; track file.id) {
    <a class="att-file" [attr.href]="file.url || null" target="_blank" rel="noopener noreferrer" [title]="file.name">
        <i class="fa-solid att-file-icon" [class]="iconFor(file)" aria-hidden="true"></i>
        <span class="att-file-name">{{ file.name }}</span>
        @if (sizeOf(file)) {
        <span class="att-file-size">{{ sizeOf(file) }}</span>
        }
    </a>
    }
</div>
}
