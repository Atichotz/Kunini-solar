<p-dialog header="Task & Ticket" [(visible)]="visible" (visibleChange)="onVisibleChange($event)" [modal]="true"
  [style]="{ width: '90vw', height: '90vh' }" [draggable]="false" [resizable]="false"
  styleClass="add-task-dialog">
  <!-- @if: content ที่ project เข้า p-dialog ถูกสร้างตั้งแต่ header โหลดแม้ dialog ยังปิดอยู่ → board โหลดข้อมูลแค่ครั้งเดียวแล้วไม่เห็น task/ticket
       ที่เพิ่มทีหลังจากหน้าอื่น (เช่น customer detail) — ครอบด้วย @if ให้สร้าง board ใหม่ (ngOnInit โหลดสด) ทุกครั้งที่เปิด -->
  @if (visible()) {
  <p-tabs value="todo">
    <p-tablist>
      <p-tab value="todo">Task</p-tab>
      <p-tab value="ticket">Ticket</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="todo">
        <app-todo-board [customers]="customers()" />
      </p-tabpanel>
      <p-tabpanel value="ticket">
        <app-ticket-board [customers]="customers()" />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
  }
</p-dialog>
