<p-toast></p-toast>

<div class="input-group">
  <label class="input-label">Category</label>
  <p-selectbutton class="k-category" [options]="categoryOptions" [(ngModel)]="selectedCategory" optionLabel="label"
    optionValue="value">
  </p-selectbutton>
</div>

<div class="k-setting-table-wrap mt-2">
  <table class="k-setting-table">
    <thead>
      <tr>
        <th>Item</th>
        <th>Description</th>
        <th>Size</th>
        <th>Cost Price</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows; track row; let i = $index) {
      <tr>
        <td><input type="number" [(ngModel)]="row.item" min="0" /></td>
        <td><input type="text" [(ngModel)]="row.description" /></td>
        <td><input type="text" [(ngModel)]="row.size" /></td>
        <td><input type="number" [(ngModel)]="row.costPrice" min="0" /></td>
        <td class="k-setting-actions">
          <button class="icon-btn save-btn" type="button" title="Save" [disabled]="row.saving" (click)="saveRow(row)">
            <i class="fas" [ngClass]="row.saving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
          </button>
          <button class="icon-btn remove-btn" type="button" title="Remove" (click)="removeRow(i)">
            <i class="fas fa-trash-alt"></i>
          </button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>

<div class="k-setting-footer">
  <button class="k-btn k-btn-outline" type="button" (click)="addRow()">
    <i class="fas fa-plus"></i> Add Row
  </button>
</div>

<h3 class="k-subsection-title !mt-4">Accessories</h3>
<div class="k-setting-table-wrap">
  <table class="k-setting-table">
    <thead>
      <tr>
        <th>Item</th>
        <th>Description</th>
        <th>Size</th>
        <th>Cost Price</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (row of accessoryRows; track row; let i = $index) {
      <tr>
        <td><input type="number" [(ngModel)]="row.item" min="0" /></td>
        <td><input type="text" [(ngModel)]="row.description" /></td>
        <td><input type="text" [(ngModel)]="row.size" /></td>
        <td><input type="number" [(ngModel)]="row.costPrice" min="0" /></td>
        <td class="k-setting-actions">
          <button class="icon-btn save-btn" type="button" title="Save" [disabled]="row.saving"
            (click)="saveAccessoryRow(row)">
            <i class="fas" [ngClass]="row.saving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
          </button>
          <button class="icon-btn remove-btn" type="button" title="Remove" (click)="removeAccessoryRow(i)">
            <i class="fas fa-trash-alt"></i>
          </button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>

<div class="k-setting-footer">
  <button class="k-btn k-btn-outline" type="button" (click)="addAccessoryRow()">
    <i class="fas fa-plus"></i> Add Accessory
  </button>
</div>
