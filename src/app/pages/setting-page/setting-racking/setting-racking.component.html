<p-toast></p-toast>

<div class="roof-type-toolbar">
  @if (!showAddRoofTypeForm) {
    <button class="k-btn-sm k-btn-outline" type="button" (click)="showAddRoofTypeForm = true">
      <i class="fas fa-plus"></i> Add Roof Type
    </button>
  } @else {
    <div class="input-group">
      <label class="input-label">Roof Type Name</label>
      <div class="roof-type-input-row">
        <input type="text" [(ngModel)]="newRoofTypeName" placeholder="e.g. Metal Sheet" (keyup.enter)="addRoofType()" />
        <button class="k-btn-sm k-btn-primary" type="button" [disabled]="addingRoofType" (click)="addRoofType()">
          <i class="fas" [ngClass]="addingRoofType ? 'fa-spinner fa-spin' : 'fa-check'"></i> Save
        </button>
        <button class="icon-btn" type="button" title="Cancel" (click)="cancelAddRoofType()">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
  }
</div>

<div class="k-setting-table-wrap">
  <table class="k-setting-table">
    <thead>
      <tr>
        <th>Roof Type</th>
        <th>Part</th>
        <th>Description</th>
        <th>Cost Price</th>
        <th>Sale Price</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows; track row; let i = $index) {
      <tr>
        <td>
          <p-select [options]="roofTypeOptions" appendTo="body" [(ngModel)]="row.roofTypeId" optionLabel="label"
            optionValue="value" placeholder="Select Roof Type" class="w-full">
          </p-select>
        </td>
        <td><input type="text" [(ngModel)]="row.part" placeholder="Part" /></td>
        <td><input type="text" [(ngModel)]="row.description" /></td>
        <td><input type="number" [(ngModel)]="row.costPrice" min="0" /></td>
        <td><input type="number" [(ngModel)]="row.salePrice" min="0" /></td>
        <td class="k-setting-actions">
          <button class="icon-btn save-btn" type="button" title="Save" [disabled]="row.saving" (click)="saveRow(row)">
            <i class="fas" [ngClass]="row.saving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
          </button>
          <button class="icon-btn remove-btn" type="button" title="Remove" (click)="removeRow(i)">
            <i class="fas fa-trash-alt"></i>
          </button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>

<div class="k-setting-footer">
  <button class="k-btn k-btn-outline" type="button" (click)="addRow()">
    <i class="fas fa-plus"></i> Add Row
  </button>
</div>
