<div class="settings-page">
  <div class="settings-layout">

    <!-- ===== Sidebar ===== -->
    <aside class="card settings-sidebar">
      <h3 class="sidebar-heading">Settings</h3>
      <ul class="nav-list">

        @if (canManage()) {
          <li class="nav-item" [class.active]="activeSection() === 'account'" (click)="selectSection('account')">
            <span class="nav-icon"><i class="fas fa-user"></i></span>
            <span class="nav-text">
              <span class="nav-title">Account</span>
              <span class="nav-desc">Manage your profile</span>
            </span>
            <i class="fas fa-chevron-right nav-arrow"></i>
          </li>
        }

        <li class="nav-item" [class.active]="activeSection() === 'products'" (click)="selectSection('products')">
          <span class="nav-icon"><i class="fa-solid fa-boxes-packing"></i></span>
          <span class="nav-text">
            <span class="nav-title">Products</span>
            <span class="nav-desc">Manage data and pricing</span>
          </span>
          <i class="fas fa-chevron-right nav-arrow"></i>
        </li>
      </ul>
    </aside>

    <!-- ===== Content ===== -->
    @if (activeSection() === 'account') {
      <app-setting-account />
    } @else if (activeSection() === 'products') {
      <app-setting-products />
    }

  </div>
</div>
